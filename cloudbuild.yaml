options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Auth
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'europe-north2-docker.pkg.dev/sleepr-497417/backend/auth:latest',
        '-f',
        'apps/auth/Dockerfile',
        '.',
      ]
  - name: 'gcr.io/cloud-builders/docker'
    args:
      ['push', 'europe-north2-docker.pkg.dev/sleepr-497417/backend/auth:latest']
